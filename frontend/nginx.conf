# Docker's embedded DNS (127.0.0.11) resolves service names dynamically.
# A plain `proxy_pass http://backend:8000/...` resolves once at config load
# and hard-exits nginx if "backend" isn't resolvable yet (a real startup
# race on container recreation) - routing through a variable instead defers
# resolution to request time via `resolver`, which also survives backend
# being recreated later without needing to restart nginx.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # No trailing path after the variable: nginx can't do location-prefix
        # rewriting with a dynamic proxy_pass target, so this forwards the
        # original request URI (e.g. /api/datasets) unchanged - which is
        # exactly right, since the backend also serves its routes under /api.
        set $backend "http://backend:8000";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
